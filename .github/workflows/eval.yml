name: Quality Gate (Eval)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run eval quality gate
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: |
          pip install -r requirements.txt
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 python app.py &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --baseline reports/eval_v2.json
          STATUS=$?
          kill "$SERVER_PID" || true
          exit "$STATUS"
